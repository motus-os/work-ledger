name: Bug report
description: Report reproducible Motus behavior that differs from the documentation.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, command arguments, raw output, transcripts, or private repository data. Report vulnerabilities through the private Security Advisory form instead.
  - type: input
    id: version
    attributes:
      label: Motus version
      description: Output from `motus version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15 arm64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Use a minimal command with sanitized values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
