<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">How Motus works</title>
  <desc id="desc">A developer or agent records a command run and adds a finding. Motus links both in a local ledger. A later search returns the finding and origin run before similar work.</desc>
  <rect width="1200" height="470" fill="#f7f8fa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101217">
    <text x="48" y="54" font-size="22" font-weight="700">How Motus works</text>
    <line x1="48" y1="82" x2="1152" y2="82" stroke="#dce1e8" stroke-width="1.5"/>

    <text x="48" y="119" fill="#606978" font-size="14" font-weight="700" letter-spacing="1.5">NOW</text>
    <rect x="48" y="142" width="252" height="88" rx="9" fill="#0d1119" stroke="#263044" stroke-width="1.5"/>
    <g transform="translate(66 162)" fill="none" stroke="#8da8ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
      <rect width="24" height="22" rx="2.5"/>
      <path d="m6 6 3 3-3 3M13 14h5"/>
    </g>
    <text x="106" y="181" fill="#e8edf6" font-family="SFMono-Regular, Consolas, monospace" font-size="14">$ your command</text>
    <rect x="176" y="207" width="184" height="68" rx="8" fill="#ffffff" stroke="#c7d3f6" stroke-width="1.5"/>
    <g transform="translate(194 226)" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7">
      <path d="M1 0h12l4 4v20H1z"/>
      <path d="M13 0v4h4M5 10h8M5 14h6M5 18h4"/>
    </g>
    <text x="226" y="246" font-size="14" font-weight="700">Finding added</text>

    <path d="M376 214h46m-9-8 9 8-9 8" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>

    <text x="442" y="119" fill="#606978" font-size="14" font-weight="700" letter-spacing="1.5">LOCAL LEDGER</text>
    <rect x="450" y="150" width="314" height="132" rx="10" fill="#edf2ff" stroke="#d4dcf5" stroke-width="1.5"/>
    <rect x="442" y="142" width="314" height="132" rx="10" fill="#ffffff" stroke="#b9c8f5" stroke-width="1.5"/>
    <g transform="translate(460 158)">
      <rect width="26" height="26" rx="6" fill="#2456e6"/>
      <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="1.8">
        <path d="M6 8h3M12 8h8M6 13h3M12 13h8M6 18h3M12 18h8"/>
      </g>
    </g>
    <text x="498" y="177" font-size="14" font-weight="700">Motus</text>
    <line x1="462" y1="199" x2="462" y2="252" stroke="#2456e6" stroke-width="2"/>
    <text x="478" y="215" font-size="12" font-weight="700" letter-spacing="1">RUN</text>
    <text x="557" y="215" fill="#606978" font-size="13">repo · commit · outcome</text>
    <text x="478" y="245" font-size="12" font-weight="700" letter-spacing="1">FINDING</text>
    <text x="557" y="245" fill="#606978" font-size="13">authored technical context</text>

    <path d="M780 214h48m-9-8 9 8-9 8" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>

    <text x="850" y="119" fill="#606978" font-size="14" font-weight="700" letter-spacing="1.5">LATER</text>
    <rect x="850" y="142" width="282" height="52" rx="8" fill="#0d1119" stroke="#27334a" stroke-width="1.5"/>
    <g transform="translate(868 156)" fill="none" stroke="#8da8ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
      <rect x="0" y="0" width="22" height="20" rx="2.5"/>
      <path d="m5 6 3 3-3 3M12 14h5"/>
    </g>
    <text x="898" y="174" fill="#e7ebf3" font-family="SFMono-Regular, Consolas, monospace" font-size="10.5">motus finding list --query term</text>
    <g transform="translate(1094 158)" fill="none" stroke="#b9c4d6" stroke-linecap="round" stroke-width="1.8">
      <circle cx="10" cy="10" r="7"/>
      <path d="m15 15 6 6"/>
    </g>
    <rect x="906" y="210" width="226" height="76" rx="8" fill="#edf2ff" stroke="#c7d3f6" stroke-width="1.5"/>
    <line x1="906" y1="222" x2="906" y2="274" stroke="#2456e6" stroke-width="3"/>
    <text x="924" y="238" font-size="14" font-weight="700">Finding</text>
    <line x1="924" y1="250" x2="1112" y2="250" stroke="#c7d3f6" stroke-width="1.2"/>
    <text x="924" y="272" font-size="14" font-weight="700">Origin run</text>

    <text x="48" y="326" font-size="18" font-weight="700">Record the run</text>
    <text x="48" y="354" fill="#303642" font-size="15">Test · build · script · check</text>
    <text x="48" y="378" fill="#303642" font-size="15">Repository · commit · outcome · time</text>

    <text x="442" y="326" font-size="18" font-weight="700">Link the finding</text>
    <text x="442" y="354" fill="#303642" font-size="15">The context stays with its source run.</text>

    <text x="850" y="326" font-size="18" font-weight="700">Retrieve before acting</text>
    <text x="850" y="354" fill="#303642" font-size="15">Search returns the finding and origin run</text>
    <text x="850" y="378" fill="#303642" font-size="15">before similar work begins.</text>

    <line x1="48" y1="420" x2="1152" y2="420" stroke="#dce1e8" stroke-width="1.5"/>
  </g>
</svg>
