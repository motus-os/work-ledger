<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">How Motus works</title>
  <desc id="desc">First, a developer, agent, or CI job records a command run. Next, a person or agent adds a finding linked to that run. Later, list finds the finding and show opens its linked run context.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .title { fill: #101217; font-size: 28px; font-weight: 700; letter-spacing: -0.4px; }
    .step { fill: #2456e6; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
    .heading { fill: #101217; font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
    .body { fill: #303642; font-size: 15px; }
    .card-title { fill: #101217; font-size: 16px; font-weight: 700; }
    .card-meta { fill: #606978; font-size: 13px; }
    .terminal-command { fill: #e8edf6; font-size: 11.5px; }
    .terminal-title { fill: #e8edf6; font-size: 15px; font-weight: 700; }
    .terminal-meta { fill: #b9c4d6; font-size: 12.5px; }
  </style>

  <rect width="960" height="370" fill="#f7f8fa"/>
  <text class="sans title" x="40" y="48">How Motus works</text>
  <path d="M40 76H920" fill="none" stroke="#dce1e8" stroke-width="1.5"/>

  <text class="sans step" x="40" y="108">01</text>
  <g aria-hidden="true">
    <rect x="40" y="124" width="260" height="108" rx="9" fill="#0d1119" stroke="#263044" stroke-width="1.5"/>
    <path d="M40 171H300" fill="none" stroke="#263044" stroke-width="1.5"/>
    <text class="mono terminal-command" x="58" y="153">$ motus wrap -- npm test</text>
    <text class="sans terminal-title" x="58" y="198">Run recorded</text>
    <text class="sans terminal-meta" x="58" y="219">repo · commit · outcome</text>
  </g>
  <text class="sans heading" x="40" y="270">Record the run</text>
  <text class="sans body" x="40" y="300">Motus records selected facts about</text>
  <text class="sans body" x="40" y="322">a test, build, script, or check.</text>

  <path d="M314 178H336" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m330 172 6 6-6 6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="sans step" x="350" y="108">02</text>
  <g aria-hidden="true">
    <rect x="350" y="124" width="260" height="108" rx="9" fill="#edf2ff" stroke="#b9c8f5" stroke-width="1.5"/>
    <text class="sans step" x="368" y="151">FINDING</text>
    <text class="sans card-title" x="368" y="182">Why this result matters</text>
    <text class="sans card-meta" x="368" y="210">explanation · decision · constraint</text>
  </g>
  <text class="sans heading" x="350" y="270">Add a finding</text>
  <text class="sans body" x="350" y="300">Link the context worth keeping</text>
  <text class="sans body" x="350" y="322">to the run that informed it.</text>

  <path d="M624 178H646" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m640 172 6 6-6 6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="sans step" x="660" y="108">03</text>
  <g aria-hidden="true">
    <rect x="660" y="124" width="260" height="108" rx="9" fill="#0d1119" stroke="#263044" stroke-width="1.5"/>
    <path d="M660 171H920" fill="none" stroke="#263044" stroke-width="1.5"/>
    <text class="mono terminal-command" x="678" y="153">$ motus finding list --query term</text>
    <text class="sans terminal-title" x="678" y="198">Finding returned</text>
    <text class="sans terminal-meta" x="678" y="219">use show to open its run context</text>
  </g>
  <text class="sans heading" x="660" y="270">Retrieve it later</text>
  <text class="sans body" x="660" y="300">Search the same local ledger</text>
  <text class="sans body" x="660" y="322">before related work.</text>
</svg>
