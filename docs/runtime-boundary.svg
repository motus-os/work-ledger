<svg xmlns="http://www.w3.org/2000/svg" width="440" height="737" viewBox="0 0 400 670" role="img" aria-labelledby="title desc">
  <title id="title">Runtime and storage boundary</title>
  <desc id="desc">A person, agent, script, or CI job invokes the Motus CLI. Motus starts an existing command and forwards its output normally. Selected run facts and explicitly supplied findings go to a local SQLite ledger, which list, show, receipt, doctor, and JSON commands read.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #101217; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
    .subtitle { fill: #606978; font-size: 15px; }
    .actor { fill: #606978; font-size: 13px; font-weight: 700; letter-spacing: 1.1px; }
    .cli-title { fill: #ffffff; font-size: 22px; font-weight: 700; }
    .cli-body { fill: #dce5ff; font-size: 14.5px; }
    .card-title { fill: #101217; font-size: 15.5px; font-weight: 700; }
    .card-body { fill: #303642; font-size: 14px; }
    .terminal-title { fill: #e8edf6; font-size: 15.5px; font-weight: 700; }
    .terminal-body { fill: #b9c4d6; font-size: 14px; }
    .note { fill: #173ca8; font-size: 14.5px; font-weight: 700; }
  </style>

  <rect width="400" height="670" fill="#f7f8fa"/>
  <text class="sans title" x="24" y="38">Runtime and storage</text>
  <text class="sans subtitle" x="24" y="64">Execution and storage follow separate paths.</text>
  <path d="M24 80H376" fill="none" stroke="#dce1e8" stroke-width="1.5"/>

  <text class="sans actor" x="93" y="116">PERSON · AGENT · SCRIPT · CI</text>
  <path d="M200 128V150" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m194 144 6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-hidden="true">
    <rect x="58" y="160" width="284" height="82" rx="9" fill="#2456e6"/>
    <text class="sans cli-title" x="200" y="195" text-anchor="middle">Motus CLI</text>
    <text class="sans cli-body" x="200" y="220" text-anchor="middle">runs on demand</text>
  </g>

  <path d="M200 242V268M106 268H294M106 268V292M294 268V292" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m100 286 6 6 6-6M288 286l6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-hidden="true">
    <rect x="24" y="302" width="164" height="174" rx="9" fill="#0d1119" stroke="#263044" stroke-width="1.5"/>
    <text class="sans terminal-title" x="42" y="335">Existing command</text>
    <text class="sans terminal-body" x="42" y="372">started directly</text>
    <text class="sans terminal-body" x="42" y="402">stdout and stderr</text>
    <text class="sans terminal-body" x="42" y="425">continue to the</text>
    <text class="sans terminal-body" x="42" y="448">terminal or CI</text>
  </g>

  <g aria-hidden="true">
    <rect x="212" y="302" width="164" height="174" rx="9" fill="#ffffff" stroke="#b9c8f5" stroke-width="1.5"/>
    <text class="sans card-title" x="230" y="335">Local SQLite</text>
    <text class="sans card-body" x="230" y="372">selected run facts</text>
    <text class="sans card-body" x="230" y="402">output counts</text>
    <text class="sans card-body" x="230" y="432">findings from</text>
    <text class="sans card-body" x="230" y="455">file or stdin</text>
  </g>

  <path d="M294 476V506" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m288 500 6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-hidden="true">
    <rect x="58" y="516" width="284" height="78" rx="9" fill="#edf2ff" stroke="#b9c8f5" stroke-width="1.5"/>
    <text class="sans card-title" x="82" y="548">Read and check the ledger</text>
    <text class="sans card-body" x="82" y="575">list · show · receipt · doctor · JSON</text>
  </g>

  <path d="M24 620H376" fill="none" stroke="#dce1e8" stroke-width="1.5"/>
  <text class="sans note" x="24" y="648">No account, daemon, server, or hosted service.</text>
</svg>
