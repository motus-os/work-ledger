<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc">
  <title id="title">Runtime and storage boundary</title>
  <desc id="desc">A person, agent, script, or CI invokes the Motus CLI. Motus starts an existing command and forwards its output normally. Selected run facts and explicitly supplied findings go to a local SQLite ledger, which list, show, receipt, doctor, and JSON commands read.</desc>
  <rect width="720" height="850" fill="#f7f8fa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101217">
    <text x="48" y="62" font-size="30" font-weight="700">Runtime and storage</text>
    <text x="48" y="98" fill="#606978" font-size="19">One command-line interface. Two explicit paths.</text>
    <line x1="48" y1="126" x2="672" y2="126" stroke="#dce1e8" stroke-width="2"/>

    <text x="360" y="174" text-anchor="middle" fill="#606978" font-size="18" font-weight="700">PERSON · AGENT · SCRIPT · CI</text>
    <path d="M360 194v38m-9-10 9 10 9-10" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>

    <rect x="210" y="250" width="300" height="92" rx="12" fill="#2456e6"/>
    <g transform="translate(238 278)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <rect width="28" height="26" rx="3"/>
      <path d="m7 7 3.5 3.5L7 14M15 17h6"/>
    </g>
    <text x="360" y="305" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">Motus CLI</text>
    <text x="360" y="329" text-anchor="middle" fill="#dce5ff" font-size="15">runs on demand</text>

    <path d="M360 342v58H190v40M360 400h170v40" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
    <path d="m181 430 9 10 9-10M521 430l9 10 9-10" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>

    <rect x="48" y="460" width="284" height="196" rx="10" fill="#0d1119" stroke="#263044" stroke-width="2"/>
    <g transform="translate(72 484)" fill="none" stroke="#8da8ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <rect width="28" height="26" rx="3"/>
      <path d="m7 7 3.5 3.5L7 14M15 17h6"/>
    </g>
    <text x="116" y="507" fill="#e8edf6" font-size="20" font-weight="700">Existing command</text>
    <text x="72" y="554" fill="#b9c4d6" font-size="17">started directly</text>
    <text x="72" y="588" fill="#b9c4d6" font-size="17">stdout and stderr continue</text>
    <text x="72" y="622" fill="#b9c4d6" font-size="17">to the terminal or CI</text>

    <rect x="388" y="460" width="284" height="196" rx="10" fill="#ffffff" stroke="#b9c8f5" stroke-width="2"/>
    <g transform="translate(412 484)">
      <rect width="30" height="30" rx="7" fill="#2456e6"/>
      <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="2">
        <path d="M7 9h4M15 9h9M7 15h4M15 15h9M7 21h4M15 21h9"/>
      </g>
    </g>
    <text x="458" y="507" font-size="20" font-weight="700">Local SQLite</text>
    <text x="412" y="554" fill="#303642" font-size="17">selected run facts</text>
    <text x="412" y="588" fill="#303642" font-size="17">output counts</text>
    <text x="412" y="622" fill="#303642" font-size="17">findings from file or stdin</text>

    <path d="M530 656v38m-9-10 9 10 9-10" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
    <rect x="252" y="714" width="420" height="76" rx="10" fill="#edf2ff" stroke="#b9c8f5" stroke-width="2"/>
    <text x="276" y="744" font-size="18" font-weight="700">Read and check the ledger</text>
    <text x="276" y="772" fill="#303642" font-size="16">list · show · receipt · doctor · JSON</text>

    <text x="48" y="824" fill="#173ca8" font-size="18" font-weight="700">No account, daemon, server, or hosted service.</text>
  </g>
</svg>
