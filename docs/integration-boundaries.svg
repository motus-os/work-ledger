<svg xmlns="http://www.w3.org/2000/svg" width="440" height="990" viewBox="0 0 400 900" role="img" aria-labelledby="title desc">
  <title id="title">Integration boundaries</title>
  <desc id="desc">External systems remain authoritative. A caller-owned workflow may select concise context and add it to a relevant Motus run. In the other direction, a caller-owned workflow may map Motus JSON into an issue, review, or project system. Motus does not synchronize systems.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #101217; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
    .subtitle { fill: #606978; font-size: 15px; }
    .section { fill: #606978; font-size: 12px; font-weight: 700; letter-spacing: 1.3px; }
    .card-title { fill: #101217; font-size: 18px; font-weight: 700; }
    .card-body { fill: #303642; font-size: 14.5px; }
    .boundary-title { fill: #101217; font-size: 17px; font-weight: 700; }
    .boundary-body { fill: #303642; font-size: 14.5px; }
    .note { fill: #173ca8; font-size: 14.5px; font-weight: 700; }
  </style>

  <rect width="400" height="900" fill="#f7f8fa"/>
  <text class="sans title" x="24" y="38">Integration boundaries</text>
  <text class="sans subtitle" x="24" y="64">Callers control what enters and what leaves.</text>
  <path d="M24 80H376" fill="none" stroke="#dce1e8" stroke-width="1.5"/>

  <text class="sans section" x="24" y="108">CONTEXT ENTERS</text>
  <g aria-hidden="true">
    <rect x="24" y="124" width="352" height="70" rx="9" fill="#ffffff" stroke="#bec6d2" stroke-width="1.5"/>
    <text class="sans card-title" x="44" y="152">Source system</text>
    <text class="sans card-body" x="44" y="177">ticket · review · project record</text>
  </g>
  <path d="M200 194V214" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m194 208 6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-hidden="true">
    <rect x="58" y="222" width="284" height="62" rx="9" fill="#edf2ff" stroke="#b9c8f5" stroke-width="1.5"/>
    <text class="sans card-title" x="78" y="249">Your workflow</text>
    <text class="sans card-body" x="78" y="271">selects the relevant context</text>
  </g>
  <path d="M200 284V304" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m194 298 6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-hidden="true">
    <rect x="24" y="312" width="352" height="70" rx="9" fill="#ffffff" stroke="#b9c8f5" stroke-width="1.5"/>
    <text class="sans card-title" x="44" y="340">Motus</text>
    <text class="sans card-body" x="44" y="365">relevant closed run + finding</text>
  </g>
  <text class="sans card-body" x="24" y="412">No relevant run? Keep the record in its source system.</text>

  <path d="M24 442H376" fill="none" stroke="#dce1e8" stroke-width="1.5"/>
  <text class="sans section" x="24" y="474">RECORDS LEAVE</text>

  <g aria-hidden="true">
    <rect x="24" y="490" width="352" height="70" rx="9" fill="#ffffff" stroke="#b9c8f5" stroke-width="1.5"/>
    <text class="sans card-title" x="44" y="518">Motus JSON</text>
    <text class="sans card-body" x="44" y="543">finding + linked run</text>
  </g>
  <path d="M200 560V580" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m194 574 6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-hidden="true">
    <rect x="58" y="588" width="284" height="62" rx="9" fill="#edf2ff" stroke="#b9c8f5" stroke-width="1.5"/>
    <text class="sans card-title" x="78" y="615">Your workflow</text>
    <text class="sans card-body" x="78" y="637">maps and routes the record</text>
  </g>
  <path d="M200 650V670" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m194 664 6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-hidden="true">
    <rect x="24" y="678" width="352" height="70" rx="9" fill="#ffffff" stroke="#bec6d2" stroke-width="1.5"/>
    <text class="sans card-title" x="44" y="706">Destination</text>
    <text class="sans card-body" x="44" y="731">issue · review · project system</text>
  </g>

  <g aria-hidden="true">
    <rect x="24" y="772" width="352" height="88" rx="9" fill="#ffffff" stroke="#b9c8f5" stroke-width="1.5"/>
    <path d="M24 790V834" fill="none" stroke="#2456e6" stroke-width="4"/>
    <text class="sans boundary-title" x="48" y="804">The boundary</text>
    <text class="sans boundary-body" x="48" y="829">Motus stores and returns records.</text>
    <text class="sans boundary-body" x="48" y="848">Your workflow decides what moves and where.</text>
  </g>
  <text class="sans note" x="24" y="882">Motus does not synchronize external systems.</text>
</svg>
