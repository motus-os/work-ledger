<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">How Motus works</title>
  <desc id="desc">A command runs through Motus and a developer or agent adds context. Motus links the finding to the run in a local ledger. A later search returns the finding and recorded run ID before similar work.</desc>
  <rect width="720" height="1280" fill="#f7f8fa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101217">
    <text x="48" y="62" font-size="28" font-weight="700">How Motus works</text>
    <line x1="48" y1="92" x2="672" y2="92" stroke="#dce1e8" stroke-width="2"/>

    <text x="48" y="135" fill="#606978" font-size="18" font-weight="700" letter-spacing="1.7">NOW</text>
    <rect x="48" y="162" width="500" height="94" rx="10" fill="#0d1119" stroke="#263044" stroke-width="2"/>
    <g transform="translate(70 183)" fill="none" stroke="#8da8ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
      <rect width="28" height="26" rx="3"/>
      <path d="m7 7 3.5 3.5L7 14M15 17h6"/>
    </g>
    <text x="116" y="207" fill="#e8edf6" font-family="SFMono-Regular, Consolas, monospace" font-size="18">$ your command</text>
    <rect x="326" y="226" width="312" height="78" rx="9" fill="#ffffff" stroke="#c7d3f6" stroke-width="2"/>
    <g transform="translate(348 247)" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <path d="M1 0h14l4 4v24H1z"/>
      <path d="M15 0v4h4M6 11h8M6 16h7M6 21h5"/>
    </g>
    <text x="388" y="272" font-size="18" font-weight="700">Context added</text>

    <text x="48" y="348" font-size="23" font-weight="700">Run the command through Motus</text>
    <text x="48" y="384" fill="#303642" font-size="19">Run: repository · commit · outcome</text>
    <text x="48" y="416" fill="#303642" font-size="19">Finding: explanation · constraint · decision · next step</text>

    <path d="M360 446v46m-9-10 9 10 9-10" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>

    <text x="48" y="538" fill="#606978" font-size="18" font-weight="700" letter-spacing="1.7">LOCAL LEDGER</text>
    <rect x="86" y="574" width="564" height="174" rx="12" fill="#edf2ff" stroke="#d4dcf5" stroke-width="2"/>
    <rect x="76" y="564" width="564" height="174" rx="12" fill="#ffffff" stroke="#b9c8f5" stroke-width="2"/>
    <g transform="translate(100 587)">
      <rect width="34" height="34" rx="7" fill="#2456e6"/>
      <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="2.2">
        <path d="M8 10h4M16 10h10M8 17h4M16 17h10M8 24h4M16 24h10"/>
      </g>
    </g>
    <text x="150" y="613" font-size="19" font-weight="700">Motus</text>
    <line x1="102" y1="640" x2="102" y2="712" stroke="#2456e6" stroke-width="3"/>
    <text x="124" y="662" font-size="16" font-weight="700" letter-spacing="1.2">RUN</text>
    <text x="250" y="662" fill="#606978" font-size="17">repo · commit · outcome</text>
    <text x="124" y="701" font-size="16" font-weight="700" letter-spacing="1.2">FINDING</text>
    <text x="250" y="701" fill="#606978" font-size="17">context for later work</text>

    <text x="48" y="790" font-size="23" font-weight="700">Motus links the finding to the run</text>
    <text x="48" y="826" fill="#303642" font-size="19">Both stay in one local, searchable ledger.</text>

    <path d="M360 852v46m-9-10 9 10 9-10" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>

    <text x="48" y="944" fill="#606978" font-size="18" font-weight="700" letter-spacing="1.7">LATER</text>
    <rect x="76" y="972" width="564" height="64" rx="9" fill="#0d1119" stroke="#27334a" stroke-width="2"/>
    <g transform="translate(100 990)" fill="none" stroke="#8da8ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
      <rect x="0" y="0" width="28" height="26" rx="3"/>
      <path d="m7 7 3.5 3.5L7 14M15 17h6"/>
    </g>
    <text x="146" y="1014" fill="#e7ebf3" font-family="SFMono-Regular, Consolas, monospace" font-size="18">motus finding list --query term</text>
    <g transform="translate(586 991)" fill="none" stroke="#b9c4d6" stroke-linecap="round" stroke-width="2.2">
      <circle cx="12" cy="12" r="8"/>
      <path d="m18 18 7 7"/>
    </g>
    <rect x="204" y="1058" width="436" height="104" rx="9" fill="#edf2ff" stroke="#c7d3f6" stroke-width="2"/>
    <line x1="204" y1="1072" x2="204" y2="1148" stroke="#2456e6" stroke-width="4"/>
    <text x="228" y="1095" font-size="18" font-weight="700">Finding</text>
    <line x1="228" y1="1111" x2="612" y2="1111" stroke="#c7d3f6" stroke-width="1.5"/>
    <text x="228" y="1140" font-size="18" font-weight="700">Run ID</text>

    <text x="48" y="1204" font-size="23" font-weight="700">Search before similar work</text>
    <text x="48" y="1240" fill="#303642" font-size="19">Motus returns the finding and run ID before the next action.</text>
  </g>
</svg>
