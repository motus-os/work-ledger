<svg xmlns="http://www.w3.org/2000/svg" width="360" height="820" viewBox="0 0 360 820" role="img" aria-labelledby="title desc">
  <title id="title">How Motus works</title>
  <desc id="desc">First, a developer, agent, or CI job records a command run. Next, a person or agent adds a finding linked to that run. Later, a search returns the finding with its source run.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .title { fill: #101217; font-size: 24px; font-weight: 700; letter-spacing: -0.35px; }
    .step { fill: #2456e6; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
    .heading { fill: #101217; font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
    .body { fill: #303642; font-size: 15.5px; }
    .card-title { fill: #101217; font-size: 16px; font-weight: 700; }
    .card-meta { fill: #606978; font-size: 13px; }
    .terminal-command { fill: #e8edf6; font-size: 12.5px; }
    .terminal-title { fill: #e8edf6; font-size: 15px; font-weight: 700; }
    .terminal-meta { fill: #b9c4d6; font-size: 12.5px; }
  </style>

  <rect width="360" height="820" fill="#f7f8fa"/>
  <text class="sans title" x="24" y="40">How Motus works</text>
  <path d="M24 64H336" fill="none" stroke="#dce1e8" stroke-width="1.5"/>

  <text class="sans step" x="24" y="92">01</text>
  <g aria-hidden="true">
    <rect x="24" y="106" width="312" height="92" rx="9" fill="#0d1119" stroke="#263044" stroke-width="1.5"/>
    <path d="M24 148H336" fill="none" stroke="#263044" stroke-width="1.5"/>
    <text class="mono terminal-command" x="40" y="133">$ motus wrap -- npm test</text>
    <text class="sans terminal-title" x="40" y="174">Run recorded</text>
    <text class="sans terminal-meta" x="40" y="191">repo · commit · outcome</text>
  </g>
  <text class="sans heading" x="24" y="228">Record the run</text>
  <text class="sans body" x="24" y="255">Motus records selected facts about</text>
  <text class="sans body" x="24" y="277">a test, build, script, or check.</text>

  <path d="M180 292V316" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m174 310 6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="sans step" x="24" y="348">02</text>
  <g aria-hidden="true">
    <rect x="24" y="362" width="312" height="92" rx="9" fill="#edf2ff" stroke="#b9c8f5" stroke-width="1.5"/>
    <text class="sans step" x="40" y="388">FINDING</text>
    <text class="sans card-title" x="40" y="418">Why this result matters</text>
    <text class="sans card-meta" x="40" y="440">explanation · decision · constraint</text>
  </g>
  <text class="sans heading" x="24" y="484">Add a finding</text>
  <text class="sans body" x="24" y="511">Link the context worth keeping</text>
  <text class="sans body" x="24" y="533">to the run that informed it.</text>

  <path d="M180 548V572" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m174 566 6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="sans step" x="24" y="604">03</text>
  <g aria-hidden="true">
    <rect x="24" y="618" width="312" height="92" rx="9" fill="#0d1119" stroke="#263044" stroke-width="1.5"/>
    <path d="M24 660H336" fill="none" stroke="#263044" stroke-width="1.5"/>
    <text class="mono terminal-command" x="40" y="645">$ motus finding list --query term</text>
    <text class="sans terminal-title" x="40" y="686">Finding returned</text>
    <text class="sans terminal-meta" x="40" y="703">with its source run</text>
  </g>
  <text class="sans heading" x="24" y="740">Retrieve it later</text>
  <text class="sans body" x="24" y="767">Search the same local ledger</text>
  <text class="sans body" x="24" y="789">before related work.</text>
</svg>
