<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Finding lifecycle</title>
  <desc id="desc">A finding links authored context to an origin run. It remains open until a new closure record either resolves it with a successful run or dismisses it with a note. The original finding remains unchanged.</desc>
  <rect width="720" height="900" fill="#f7f8fa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#101217">
    <text x="48" y="62" font-size="30" font-weight="700">Finding lifecycle</text>
    <text x="48" y="98" fill="#606978" font-size="19">A closure is appended. The original finding does not change.</text>
    <line x1="48" y1="126" x2="672" y2="126" stroke="#dce1e8" stroke-width="2"/>

    <rect x="196" y="164" width="328" height="116" rx="10" fill="#0d1119" stroke="#263044" stroke-width="2"/>
    <g transform="translate(220 188)" fill="none" stroke="#8da8ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <rect width="28" height="26" rx="3"/>
      <path d="m7 7 3.5 3.5L7 14M15 17h6"/>
    </g>
    <text x="266" y="209" fill="#e8edf6" font-size="20" font-weight="700">Origin run</text>
    <text x="220" y="250" fill="#b9c4d6" font-size="17">repository · commit · outcome</text>

    <path d="M360 280v46m-9-10 9 10 9-10" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>

    <rect x="126" y="346" width="468" height="158" rx="10" fill="#ffffff" stroke="#b9c8f5" stroke-width="2"/>
    <line x1="126" y1="368" x2="126" y2="482" stroke="#2456e6" stroke-width="4"/>
    <g transform="translate(154 372)" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <path d="M1 0h14l4 4v24H1z"/>
      <path d="M15 0v4h4M6 11h8M6 16h7M6 21h5"/>
    </g>
    <text x="200" y="395" font-size="22" font-weight="700">Open finding</text>
    <text x="154" y="444" fill="#303642" font-size="18">summary · hypothesis · next step</text>
    <text x="154" y="476" fill="#606978" font-size="17">linked to the origin run</text>

    <path d="M360 504v54M360 558H194v42M360 558h166v42" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
    <path d="m185 590 9 10 9-10M517 590l9 10 9-10" fill="none" stroke="#2456e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>

    <rect x="48" y="620" width="292" height="174" rx="10" fill="#edf2ff" stroke="#b9c8f5" stroke-width="2"/>
    <circle cx="84" cy="658" r="14" fill="#2456e6"/>
    <path d="m77 658 5 5 9-11" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
    <text x="110" y="665" font-size="22" font-weight="700">Resolved</text>
    <text x="76" y="714" fill="#303642" font-size="18">closure note</text>
    <text x="76" y="746" fill="#303642" font-size="18">successful run required</text>

    <rect x="380" y="620" width="292" height="174" rx="10" fill="#ffffff" stroke="#bec6d2" stroke-width="2"/>
    <circle cx="416" cy="658" r="14" fill="#606978"/>
    <path d="M409 658h14" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="2.5"/>
    <text x="442" y="665" font-size="22" font-weight="700">Dismissed</text>
    <text x="408" y="714" fill="#303642" font-size="18">closure note</text>
    <text x="408" y="746" fill="#303642" font-size="18">no resolving run</text>

    <line x1="48" y1="838" x2="672" y2="838" stroke="#dce1e8" stroke-width="2"/>
    <text x="360" y="873" text-anchor="middle" fill="#173ca8" font-size="18" font-weight="700">Open state is derived from the absence of a closure.</text>
  </g>
</svg>
