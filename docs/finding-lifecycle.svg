<svg xmlns="http://www.w3.org/2000/svg" width="420" height="723" viewBox="0 0 360 620" role="img" aria-labelledby="title desc">
  <title id="title">Finding lifecycle</title>
  <desc id="desc">A finding links authored context to an origin run. It remains open until one closure either resolves it with a successful run or dismisses it with a note. The original finding does not change.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #101217; font-size: 24px; font-weight: 700; letter-spacing: -0.35px; }
    .subtitle { fill: #606978; font-size: 14.5px; }
    .label { fill: #2456e6; font-size: 12px; font-weight: 700; letter-spacing: 1.1px; }
    .card-title { fill: #101217; font-size: 18px; font-weight: 700; }
    .card-body { fill: #303642; font-size: 14.5px; }
    .terminal-title { fill: #e8edf6; font-size: 17px; font-weight: 700; }
    .terminal-body { fill: #b9c4d6; font-size: 13px; }
    .note { fill: #173ca8; font-size: 14.5px; font-weight: 700; }
  </style>

  <rect width="360" height="620" fill="#f7f8fa"/>
  <text class="sans title" x="24" y="38">Finding lifecycle</text>
  <text class="sans subtitle" x="24" y="63">The original finding stays unchanged.</text>
  <path d="M24 80H336" fill="none" stroke="#dce1e8" stroke-width="1.5"/>

  <g aria-hidden="true">
    <rect x="48" y="98" width="264" height="68" rx="9" fill="#0d1119" stroke="#263044" stroke-width="1.5"/>
    <text class="sans terminal-title" x="68" y="128">Origin run</text>
    <text class="sans terminal-body" x="68" y="151">repository · commit · outcome</text>
  </g>

  <path d="M180 166V188" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m174 182 6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-hidden="true">
    <rect x="24" y="198" width="312" height="96" rx="9" fill="#ffffff" stroke="#b9c8f5" stroke-width="1.5"/>
    <path d="M24 216V276" fill="none" stroke="#2456e6" stroke-width="4"/>
    <text class="sans card-title" x="48" y="232">Open finding</text>
    <text class="sans card-body" x="48" y="258">summary · hypothesis · next step</text>
    <text class="sans card-body" x="48" y="281">linked to the origin run</text>
  </g>

  <path d="M180 294V316" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round"/>
  <path d="m174 310 6 6 6-6" fill="none" stroke="#2456e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="sans label" x="24" y="342">ONE CLOSURE</text>
  <g aria-hidden="true">
    <rect x="24" y="356" width="312" height="78" rx="9" fill="#edf2ff" stroke="#b9c8f5" stroke-width="1.5"/>
    <circle cx="49" cy="381" r="11" fill="#2456e6"/>
    <path d="m44 381 3.5 3.5 6.5-7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="sans card-title" x="70" y="387">Resolved</text>
    <text class="sans card-body" x="48" y="417">closure note · successful run required</text>
  </g>

  <text class="sans label" x="170" y="458">OR</text>

  <g aria-hidden="true">
    <rect x="24" y="472" width="312" height="78" rx="9" fill="#ffffff" stroke="#bec6d2" stroke-width="1.5"/>
    <circle cx="49" cy="497" r="11" fill="#606978"/>
    <path d="M44 497H54" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text class="sans card-title" x="70" y="503">Dismissed</text>
    <text class="sans card-body" x="48" y="533">closure note · no resolving run</text>
  </g>

  <path d="M24 575H336" fill="none" stroke="#dce1e8" stroke-width="1.5"/>
  <text class="sans note" x="24" y="600">Open means no closure has been recorded.</text>
</svg>
